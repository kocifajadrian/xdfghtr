<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <!-- No icon in the browser tab, only the name. An empty icon stops the browser from asking for /favicon.ico. -->
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#4b6e55" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ubian" />
    <meta name="description" content="Ubian: cestovné poriadky, lístky a kredit na jednom mieste." />
    <title>ubian</title>
    <script>
      // Set light or dark before first paint so the page does not flash.
      try {
        var t = localStorage.getItem('ubian.theme')
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', t === 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
